# star.byb.kr — 정적 내보내기(out/)를 내려주는 nginx 설정 (Dockerfile에서 /etc/nginx/conf.d/default.conf 로 쓴다).
# 앞단 Traefik이 TLS를 맡고, 이 컨테이너는 80번에서 평문으로 받는다.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 압축: 처음 받는 양(약 0.68MB)은 압축 기준이다
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml application/xml;

    # 파일 이름에 해시가 있는 빌드 산출물(JS·CSS·글꼴 조각): 1년, 바뀌지 않음
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 샘플 사진: 파일 이름에 해시가 없어 하루
    location /samples/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # PWA (docs/pwa.md): 서비스 워커는 늘 새로 확인해야 배포가 바로 퍼진다 (아래 location / 의 no-cache를 명시)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 페이지(HTML): 배포하면 바로 새 버전. /games/birthday → games/birthday.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 없는 주소는 Next가 만든 404 페이지
    error_page 404 /404.html;
    location = /404.html {
        # 오류 응답에도 헤더를 넣으려면 always
        add_header Cache-Control "no-cache" always;
        internal;
    }
}
